<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fae8ef">
  <title>심으뜸 되기 프로젝트</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      --ink: #432537;
      --muted: #745366;
      --rose: #873654;
      --pink: #f8dfeb;
      --line: #e8cada;
      --paper: #fffafd;
      color: var(--ink);
      background: #faedf3;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0;
      background: radial-gradient(ellipse at top left, #fff8fb, transparent 60%),
                  linear-gradient(135deg, #faedf3, #f6d7e5);
    }
    h1, h2, h3, p, figure, fieldset { margin: 0; }
    h1, h2, h3 { letter-spacing: -.045em; }
    h2 { font-size: clamp(1.2rem, 4.5vw, 1.65rem); }
    h3 { font-size: 1.1rem; overflow-wrap: anywhere; }
    button, input, select, textarea { font: inherit; color: inherit; }
    button, .link-button {
      min-height: 44px;
      padding: .45rem .8rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff9fc;
      cursor: pointer;
    }
    button:hover, .link-button:hover { background: var(--pink); }
    button:disabled { opacity: .6; cursor: wait; }
    .primary, button[aria-pressed="true"] {
      color: white;
      background: var(--rose);
      border-color: var(--rose);
      font-weight: 650;
    }
    .primary:hover, button[aria-pressed="true"]:hover { background: #702845; }
    :focus-visible { outline: 3px solid var(--rose); outline-offset: 3px; }
    a { color: var(--rose); }
    .link-button { display: inline-flex; align-items: center; text-decoration: none; }

    .shell {
      width: min(1100px, calc(100% - 1.25rem));
      margin: .8rem auto 2.5rem;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .stack { display: grid; gap: .8rem; min-width: 0; }
    .row { display: flex; align-items: center; flex-wrap: wrap; gap: .45rem; }
    .between { justify-content: space-between; }
    .space { margin-top: .75rem; }
    .muted { color: var(--muted); line-height: 1.5; }
    .message { color: var(--rose); line-height: 1.5; }
    .message:empty { display: none; }
    .card {
      min-width: 0;
      padding: clamp(.75rem, 3vw, 1.3rem);
      border: 1px solid var(--line);
      border-radius: 1.35rem;
      background: var(--paper);
      box-shadow: 0 10px 28px #78345212;
    }
    .hero {
      padding: clamp(1.65rem, 6vw, 3.6rem) .6rem;
      border: 1px solid #fff8fc;
      border-radius: 1.55rem;
      text-align: center;
      word-break: keep-all;
      background:
        radial-gradient(circle, #fffc 1px, transparent 1.8px) 0 0 / 17px 17px,
        radial-gradient(ellipse at 50% 40%, #fff7fb, transparent 72%),
        linear-gradient(135deg, #fae2ec, #efbbd2);
    }
    .hero svg { display: block; margin: 0 auto .45rem; color: var(--rose); }
    .hero h1 { font-size: clamp(1.8rem, 7vw, 4rem); line-height: 1.15; }
    .hero p { margin-top: .65rem; color: #713957; font-size: clamp(1rem, 3vw, 1.2rem); }

    .icon {
      display: inline-grid;
      place-items: center;
      flex: 0 0 44px;
      width: 44px;
      height: 44px;
      padding: 0;
      color: var(--rose);
    }
    .add-photo { background: var(--pink); font-size: 1.55rem; }
    .trash { margin-left: auto; }
    .photo-form { max-width: 640px; }
    .board {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 175px), 1fr));
      align-items: start;
      gap: .65rem;
    }
    .board.empty { display: block; }
    .photo {
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 1rem;
      background: white;
    }
    .photo-view {
      display: block;
      width: 100%;
      min-height: 0;
      padding: 0;
      border: 0;
      border-radius: 0;
      cursor: zoom-in;
    }
    .photo-view:focus-visible { outline-offset: -3px; }
    .photo-view img { display: block; width: 100%; height: auto; }
    .photo figcaption { padding: .25rem .45rem .3rem .65rem; }
    .photo-caption { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    .placeholder {
      padding: .9rem;
      text-align: center;
      border: 1px dashed #c995b0;
      border-radius: .85rem;
      background: #fcf0f6;
    }
    dialog {
      width: min(94vw, 850px);
      max-height: 94dvh;
      padding: .65rem;
      border: 1px solid var(--line);
      border-radius: 1rem;
      background: var(--paper);
      color: var(--ink);
    }
    dialog::backdrop { background: #34202dd9; }
    .preview-header { display: flex; justify-content: flex-end; margin-bottom: .4rem; }
    #preview-image {
      display: block;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: calc(88dvh - 60px);
      margin-inline: auto;
      object-fit: contain;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr);
      align-items: start;
      gap: .8rem;
    }
    .switch {
      display: flex;
      gap: .2rem;
      width: fit-content;
      margin-inline: auto;
      padding: .2rem;
      border-radius: 999px;
      background: #f8e5ee;
    }
    .switch button { min-width: 72px; }
    .period-row {
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr) 44px;
      gap: .25rem;
      align-items: center;
      text-align: center;
    }
    .period-row h2 { font-size: clamp(1rem, 4vw, 1.4rem); }
    .arrow { font-size: 1.55rem; line-height: 1; }
    .grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: .18rem; }
    .weekday { padding: .3rem 0; text-align: center; color: var(--muted); }
    .day {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .13rem;
      min-width: 0;
      min-height: 63px;
      padding: .28rem 0;
      border-radius: .65rem;
    }
    .day[aria-current="date"] .date-number { text-decoration: underline; text-underline-offset: .2em; }
    .tag, .badge { border-radius: .35rem; color: var(--ink); }
    .tag { padding: .17rem .42rem; font-size: .875rem; }
    .badge { padding-inline: .12rem; font-size: .75rem; font-variant-numeric: tabular-nums; }
    .workout { background: #f5cde1; }
    .meal { background: #eee0f6; }
    .legend { font-size: .9rem; }

    .entry {
      display: grid;
      gap: .45rem;
      min-width: 0;
      padding: .7rem;
      border: 1px solid var(--line);
      border-radius: .9rem;
      background: white;
    }
    .entry.done { border-left: 4px solid var(--rose); }
    .description { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.55; }
    form { display: grid; gap: .75rem; }
    .field { display: grid; gap: .3rem; min-width: 0; }
    .fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .55rem; }
    .field input, select, textarea, .task-input {
      width: 100%;
      min-width: 0;
      min-height: 44px;
      padding: .55rem;
      border: 1px solid #c59ab0;
      border-radius: .65rem;
      background: white;
      font-size: 1rem;
    }
    textarea { resize: vertical; }
    fieldset { min-width: 0; padding: 0; border: 0; }
    legend { margin-bottom: .35rem; padding: 0; }
    .meal-options { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .3rem; }
    .meal-option { position: relative; }
    .meal-option input { position: absolute; opacity: 0; width: 1px; height: 1px; }
    .meal-option span {
      display: grid;
      place-items: center;
      min-height: 44px;
      padding: .35rem .1rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: white;
      cursor: pointer;
    }
    .meal-option input:checked + span { color: white; background: var(--rose); font-weight: 650; }
    .meal-option input:focus-visible + span { outline: 3px solid var(--rose); outline-offset: 2px; }
    .tasks { display: grid; gap: .38rem; padding: 0; margin: 0; list-style: none; }
    .task-edit { display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; gap: .25rem; align-items: center; }
    .task-line { display: flex; align-items: center; min-height: 44px; overflow-wrap: anywhere; }
    .task-line span { min-width: 0; }
    .check {
      appearance: none;
      display: grid;
      place-items: center;
      flex: 0 0 44px;
      width: 44px;
      height: 44px;
      margin: 0;
      border: 0;
      border-radius: 50%;
      background: transparent;
      cursor: pointer;
    }
    .check::before {
      content: "";
      display: grid;
      place-items: center;
      width: 22px;
      height: 22px;
      border: 1.5px solid var(--rose);
      border-radius: 50%;
      box-sizing: border-box;
    }
    .check:checked::before { content: "✓"; background: var(--rose); color: white; }
    .check:checked + span { color: var(--muted); text-decoration: line-through; }

    @media (max-width: 720px) {
      .layout { grid-template-columns: minmax(0, 1fr); }
      .board:not(.empty) {
        grid-template-columns: none;
        grid-auto-flow: column;
        grid-auto-columns: clamp(140px, 47vw, 220px);
        overflow-x: auto;
        padding: .25rem .25rem .55rem;
        scroll-snap-type: x proximity;
      }
      .photo { scroll-snap-align: start; }
    }
    @media (max-width: 360px) {
      .card { padding: .6rem; }
      .fields { grid-template-columns: minmax(0, 1fr); }
    }
  </style>
</head>
<body>
  <main class="shell stack">
    <header class="hero">
      <svg width="42" height="28" viewBox="0 0 42 28" fill="none" stroke="currentColor"
           stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 13C12 1 4 2 5 8c1 6 10 7 16 5Zm0 0C30 1 38 2 37 8c-1 6-10 7-16 5Zm0 0c-1 5-5 9-9 11m9-11c1 5 5 9 9 11"/>
      </svg>
      <h1>심으뜸 되기 프로젝트</h1>
      <p>지금 나의 선택이 변화된 나를 만든다</p>
    </header>

    <p id="storage-message" class="message" role="alert"></p>

    <section class="card" aria-labelledby="board-title">
      <div class="row between">
        <h2 id="board-title">자극받고가라</h2>
        <button id="add-photo" class="icon add-photo" type="button" title="사진 추가"
                aria-label="사진 추가" aria-controls="photo-form" aria-expanded="false">＋</button>
      </div>
      <form id="photo-form" class="photo-form space" hidden>
        <div>
          <a class="link-button" href="https://www.pinterest.com/" target="_blank"
             rel="noopener noreferrer">Pinterest 열기</a>
        </div>
        <p class="muted">Pinterest에서 고른 사진을 기기에 저장한 뒤 아래에서 선택하세요.</p>
        <label class="field">이미지 파일 선택
          <input id="photo-file" type="file" required
                 accept="image/jpeg,image/png,image/webp,image/gif,image/avif">
        </label>
        <label class="field">사진 설명 (선택)
          <input id="photo-description" maxlength="100">
        </label>
        <div><button id="save-photo" class="primary" type="submit">보드에 추가</button></div>
      </form>
      <p id="photo-message" class="message space" role="status"></p>
      <div id="board" class="board space"></div>
    </section>

    <div class="layout">
      <section class="card" aria-label="운동과 식단 캘린더">
        <div class="switch" role="group" aria-label="캘린더 보기">
          <button id="week" type="button" aria-pressed="true">주간</button>
          <button id="month" type="button" aria-pressed="false">월간</button>
        </div>
        <div class="period-row space">
          <button id="previous" class="icon arrow" type="button" aria-label="이전 주">‹</button>
          <h2 id="period" aria-live="polite"></h2>
          <button id="next" class="icon arrow" type="button" aria-label="다음 주">›</button>
        </div>
        <div class="grid space" aria-hidden="true">
          <span class="weekday">월</span><span class="weekday">화</span>
          <span class="weekday">수</span><span class="weekday">목</span>
          <span class="weekday">금</span><span class="weekday">토</span>
          <span class="weekday">일</span>
        </div>
        <div id="calendar" class="grid" role="group" aria-labelledby="period"></div>
        <div class="row legend space">
          <span class="tag workout">운동</span>
          <span class="tag meal">식단</span>
          <span class="muted">진행률</span>
        </div>
        <p id="totals" class="muted space" role="status"></p>
      </section>

      <div class="stack">
        <section class="card" aria-labelledby="day-title">
          <div class="row between">
            <h2 id="day-title"></h2>
            <button id="new-entry" type="button">＋ 일정</button>
          </div>
          <div id="entries" class="stack space"></div>
          <p id="day-message" class="message space" role="status"></p>
        </section>

        <section class="card" aria-labelledby="form-title">
          <h2 id="form-title">일정 추가</h2>
          <form id="entry-form" class="space">
            <label class="field">종류
              <select id="kind">
                <option value="workout">운동 루틴</option>
                <option value="meal">식단</option>
              </select>
            </label>
            <fieldset id="meal-field" hidden>
              <legend>끼니</legend>
              <div class="meal-options">
                <label class="meal-option"><input type="radio" name="slot" value="아침" checked><span>아침</span></label>
                <label class="meal-option"><input type="radio" name="slot" value="점심"><span>점심</span></label>
                <label class="meal-option"><input type="radio" name="slot" value="저녁"><span>저녁</span></label>
                <label class="meal-option"><input type="radio" name="slot" value="간식"><span>간식</span></label>
              </div>
            </fieldset>
            <div class="fields">
              <label class="field">날짜 <input id="date" type="date" required></label>
              <label class="field">시간 <input id="time" type="time"></label>
            </div>
            <label class="field"><span id="name-label">루틴명</span><input id="name" maxlength="80" required></label>
            <fieldset id="workout-field">
              <legend>상세 운동 내용</legend>
              <ul id="task-fields" class="tasks"></ul>
              <button id="add-task" class="space" type="button">＋ 운동 항목</button>
            </fieldset>
            <label id="meal-notes-field" class="field" hidden>식단 기록
              <textarea id="details" rows="4" maxlength="1200" placeholder="예: 밥, 달걀, 볶은 채소"></textarea>
            </label>
            <div class="row">
              <button id="save-entry" class="primary" type="submit">추가</button>
              <button id="example" type="button">루틴 예시</button>
              <button id="cancel" type="button" hidden>취소</button>
            </div>
          </form>
          <p id="form-message" class="message space" role="status"></p>
        </section>
      </div>
    </div>
  </main>

  <dialog id="preview" aria-label="사진 크게 보기">
    <form method="dialog" class="preview-header"><button type="submit" autofocus>닫기</button></form>
    <img id="preview-image" alt="">
  </dialog>

  <template id="photo-template">
    <figure class="photo">
      <button class="photo-view" type="button" aria-label="사진 크게 보기">
        <img alt="" decoding="async">
      </button>
      <p class="placeholder muted photo-error" hidden>사진을 불러오지 못했어요.</p>
      <figcaption class="row">
        <p class="photo-caption" hidden></p>
        <button class="icon trash" type="button" title="사진 삭제" aria-label="사진 삭제">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 10v7m4-7v7"/>
          </svg>
        </button>
      </figcaption>
    </figure>
  </template>

  <template id="entry-template">
    <article class="entry">
      <div class="row"><span class="tag"></span><span class="muted entry-meta"></span></div>
      <h3></h3>
      <p class="description" hidden></p>
      <ul class="tasks" aria-label="운동 체크리스트" hidden></ul>
      <div class="row">
        <button type="button" data-action="toggle"></button>
        <button type="button" data-action="edit">수정</button>
        <button type="button" data-action="copy">복사</button>
        <button type="button" data-action="delete">삭제</button>
      </div>
    </article>
  </template>

  <template id="task-template">
    <li class="task-edit">
      <input class="check" type="checkbox" aria-label="운동 항목 완료">
      <input class="task-input" maxlength="1200" placeholder="예: 스쿼트 3세트 × 8회" aria-label="운동 내용">
      <button class="icon remove-task" type="button" aria-label="운동 항목 제거">×</button>
    </li>
  </template>

  <script>
    "use strict";

    const $ = id => document.getElementById(id);
    const ENTRY_KEY = "student-fitness-planner-v1";
    const PHOTO_KEY = "student-fitness-inspiration-v1";
    const entryForm = $("entry-form");
    const photoForm = $("photo-form");
    const taskFields = $("task-fields");
    const dateFormat = new Intl.DateTimeFormat("ko-KR", {
      year: "numeric", month: "long", day: "numeric", weekday: "long"
    });
    const exerciseExample = [
      "가볍게 걷기 5분",
      "스쿼트 2세트 × 8회",
      "덤벨 로우 2세트 × 10회",
      "푸시업 2세트 × 6회"
    ];
    const mealExamples = {
      아침: ["요거트 볼", "플레인 요거트, 오트밀, 바나나"],
      점심: ["달걀 비빔밥", "밥, 달걀, 나물과 채소"],
      저녁: ["두부 덮밥", "밥, 두부, 볶은 채소"],
      간식: ["과일과 요거트", "제철 과일, 플레인 요거트"]
    };

    let entries = readList(ENTRY_KEY);
    let photos = readList(PHOTO_KEY);
    let selected = new Date();
    let view = "week";
    let formMode = "add";
    let editingId = null;

    function readList(key) {
      try {
        const list = JSON.parse(localStorage.getItem(key) ?? "[]");
        if (!Array.isArray(list)) throw new Error();
        return list.filter(item => item && typeof item.id === "string");
      } catch {
        $("storage-message").textContent = "저장된 일부 데이터를 읽을 수 없어요.";
        return [];
      }
    }

    function saveList(key, list, messageId) {
      try {
        localStorage.setItem(key, JSON.stringify(list));
        return true;
      } catch {
        $(messageId).textContent = "저장하지 못했어요. 브라우저 저장 공간과 설정을 확인해 주세요.";
        return false;
      }
    }

    function newId() {
      return `${Date.now()}-${Math.random().toString(36).slice(2)}`;
    }

    function localDate(year, month, day) {
      const date = new Date(2000, 0, 1, 12);
      date.setFullYear(year, month, day);
      return date;
    }

    function addDays(date, amount) {
      return localDate(date.getFullYear(), date.getMonth(), date.getDate() + amount);
    }

    function dateKey(date) {
      const pad = number => String(number).padStart(2, "0");
      const year = String(date.getFullYear()).padStart(4, "0");
      return `${year}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
    }

    function mondayIndex(date) {
      return (date.getDay() + 6) % 7;
    }

    function workoutTasks(record) {
      if (Array.isArray(record.tasks)) return record.tasks;
      return String(record.details ?? "").split(/\r?\n/)
        .map(line => line.trim())
        .filter(Boolean)
        .map(text => ({ text, done: false }));
    }

    function entryProgress(record) {
      const tasks = record.kind === "workout" ? workoutTasks(record) : [];
      if (tasks.length === 0) return record.done ? 1 : 0;
      return tasks.filter(task => task.done).length / tasks.length;
    }

    function progressLabel(records, kind) {
      const matching = records.filter(record => record.kind === kind);
      if (matching.length === 0) return "0%";
      const sum = matching.reduce((total, record) => total + entryProgress(record), 0);
      return `${Math.round(100 * sum / matching.length)}%`;
    }

    function chooseDate(date, focusDay = false) {
      selected = date;
      if (formMode !== "edit") $("date").value = dateKey(date);
      $("day-message").textContent = "";
      renderSchedule();
      if (focusDay) $("calendar").querySelector('[aria-pressed="true"]')?.focus();
    }

    function renderCalendar() {
      const monthly = view === "month";
      const year = selected.getFullYear();
      const month = selected.getMonth();
      const first = monthly ? localDate(year, month, 1) : addDays(selected, -mondayIndex(selected));
      const length = monthly ? localDate(year, month + 1, 0).getDate() : 7;
      const last = addDays(first, length - 1);
      const firstKey = dateKey(first);
      const lastKey = dateKey(last);
      const today = dateKey(new Date());
      const active = dateKey(selected);
      const records = entries.filter(entry => entry.date >= firstKey && entry.date <= lastKey);

      const shortDate = date => `${date.getMonth() + 1}.${date.getDate()}`;
      const end = last.getFullYear() === first.getFullYear()
        ? shortDate(last)
        : `${last.getFullYear()}.${shortDate(last)}`;

      $("period").textContent = monthly
        ? `${year}년 ${month + 1}월`
        : `${first.getFullYear()}.${shortDate(first)} – ${end}`;
      $("previous").setAttribute("aria-label", monthly ? "이전 달" : "이전 주");
      $("next").setAttribute("aria-label", monthly ? "다음 달" : "다음 주");
      $("week").setAttribute("aria-pressed", String(!monthly));
      $("month").setAttribute("aria-pressed", String(monthly));
      $("totals").textContent =
        `운동 ${progressLabel(records, "workout")} · 식단 ${progressLabel(records, "meal")}`;

      const calendar = $("calendar");
      calendar.replaceChildren();

      for (let index = 0; monthly && index < mondayIndex(first); index++) {
        const spacer = document.createElement("span");
        spacer.setAttribute("aria-hidden", "true");
        calendar.append(spacer);
      }

      for (let index = 0; index < length; index++) {
        const date = addDays(first, index);
        const key = dateKey(date);
        const daily = records.filter(record => record.date === key);
        const day = document.createElement("button");
        day.type = "button";
        day.className = "day";
        day.setAttribute("aria-pressed", String(key === active));
        if (key === today) day.setAttribute("aria-current", "date");

        const number = document.createElement("span");
        number.className = "date-number";
        number.textContent = date.getDate();
        day.append(number);

        const labels = [dateFormat.format(date)];
        for (const [kind, label] of [["workout", "운동"], ["meal", "식단"]]) {
          if (!daily.some(record => record.kind === kind)) continue;
          const badge = document.createElement("span");
          badge.className = `badge ${kind}`;
          badge.textContent = progressLabel(daily, kind);
          badge.setAttribute("aria-hidden", "true");
          day.append(badge);
          labels.push(`${label} 진행률 ${badge.textContent}`);
        }

        day.setAttribute("aria-label", labels.join(", "));
        day.addEventListener("click", () => chooseDate(date, true));
        calendar.append(day);
      }
    }

    function updateEntry(id, changes, messageId) {
      const updated = entries.map(entry => entry.id === id ? { ...entry, ...changes } : entry);
      if (!saveList(ENTRY_KEY, updated, messageId)) return false;
      entries = updated;
      return true;
    }

    function renderWorkoutTasks(list, record) {
      const tasks = workoutTasks(record);
      list.hidden = !tasks.length;

      tasks.forEach((task, index) => {
        const item = document.createElement("li");
        const label = document.createElement("label");
        label.className = "task-line";
        const check = document.createElement("input");
        check.type = "checkbox";
        check.className = "check";
        check.checked = Boolean(task.done);
        const text = document.createElement("span");
        text.textContent = task.text;
        label.append(check, text);
        item.append(label);
        list.append(item);

        check.addEventListener("change", () => {
          const current = entries.find(entry => entry.id === record.id);
          const updated = workoutTasks(current).map((row, rowIndex) =>
            rowIndex === index ? { ...row, done: check.checked } : row
          );

          if (!updateEntry(record.id, { tasks: updated }, "day-message")) {
            check.checked = !check.checked;
            return;
          }

          $("day-message").textContent = "";
          if (editingId === record.id) {
            const draftCheck = taskFields.querySelector(`[data-index="${index}"] .check`);
            if (draftCheck) draftCheck.checked = check.checked;
          }
          renderCalendar();
        });
      });
    }

    function renderEntries() {
      const list = $("entries");
      $("day-title").textContent = dateFormat.format(selected);
      list.replaceChildren();

      const daily = entries.filter(record => record.date === dateKey(selected))
        .sort((a, b) => (a.time || "99:99").localeCompare(b.time || "99:99"));

      if (!daily.length) {
        const empty = document.createElement("p");
        empty.className = "muted";
        empty.textContent = "이날은 아직 등록한 일정이 없어요.";
        list.append(empty);
      }

      daily.forEach((record, index) => {
        const card = $("entry-template").content.firstElementChild.cloneNode(true);
        const meal = record.kind === "meal";
        const tag = card.querySelector(".tag");
        tag.classList.add(meal ? "meal" : "workout");
        tag.textContent = meal ? `식단 · ${record.slot}` : "운동";
        card.classList.toggle("done", Boolean(record.done));
        card.querySelector(".entry-meta").textContent =
          `${record.time || "시간 미정"} · ${record.done ? "완료" : "예정"}`;
        card.querySelector("h3").textContent = record.title;

        if (meal) {
          const details = card.querySelector(".description");
          details.textContent = record.details || "";
          details.hidden = !record.details;
        } else {
          renderWorkoutTasks(card.querySelector(".tasks"), record);
        }

        const toggle = card.querySelector('[data-action="toggle"]');
        toggle.textContent = record.done ? "완료 취소" : "일정 완료";
        toggle.addEventListener("click", () => {
          if (!updateEntry(record.id, { done: !record.done }, "day-message")) return;
          renderSchedule();
          list.children[index]?.querySelector('[data-action="toggle"]')?.focus();
          $("day-message").textContent = record.done ? "예정 상태로 돌렸어요." : "일정을 완료했어요.";
        });

        card.querySelector('[data-action="edit"]').addEventListener("click", () => fillForm(record, "edit"));
        card.querySelector('[data-action="copy"]').addEventListener("click", () => fillForm(record, "copy"));
        card.querySelector('[data-action="delete"]').addEventListener("click", () => {
          if (!confirm(`‘${record.title}’ 일정을 삭제할까요?`)) return;
          const updated = entries.filter(entry => entry.id !== record.id);
          if (!saveList(ENTRY_KEY, updated, "day-message")) return;
          entries = updated;
          if (editingId === record.id) resetForm();
          renderSchedule();
          $("new-entry").focus();
          $("day-message").textContent = "일정을 삭제했어요.";
        });

        list.append(card);
      });
    }

    function renderSchedule() {
      renderCalendar();
      renderEntries();
    }

    function navigate(direction) {
      if (view === "week") {
        chooseDate(addDays(selected, direction * 7));
        return;
      }
      const year = selected.getFullYear();
      const month = selected.getMonth() + direction;
      const lastDay = localDate(year, month + 1, 0).getDate();
      chooseDate(localDate(year, month, Math.min(lastDay, selected.getDate())));
    }

    function addTaskRow(task = { text: "", done: false }, focus = false, originalIndex = null) {
      const row = $("task-template").content.firstElementChild.cloneNode(true);
      const input = row.querySelector(".task-input");
      input.value = task.text;
      row.querySelector(".check").checked = Boolean(task.done);
      if (originalIndex !== null) row.dataset.index = originalIndex;

      row.querySelector(".remove-task").addEventListener("click", () => {
        const neighbor = row.nextElementSibling || row.previousElementSibling;
        row.remove();
        if (neighbor) neighbor.querySelector(".task-input").focus();
        else addTaskRow(undefined, true);
      });

      taskFields.append(row);
      if (focus) input.focus();
    }

    function setTaskRows(tasks) {
      taskFields.replaceChildren();
      if (!tasks.length) addTaskRow();
      else tasks.forEach((task, index) => addTaskRow(task, false, index));
    }

    function readTasks() {
      return [...taskFields.children].map(row => ({
        text: row.querySelector(".task-input").value.trim(),
        done: row.querySelector(".check").checked
      })).filter(task => task.text);
    }

    function refreshForm() {
      const meal = $("kind").value === "meal";
      $("meal-field").hidden = !meal;
      $("meal-notes-field").hidden = !meal;
      $("workout-field").hidden = meal;
      $("name-label").textContent = meal ? "메뉴 이름" : "루틴명";
      $("example").textContent = meal ? "식단 예시" : "루틴 예시";
    }

    function resetForm() {
      formMode = "add";
      editingId = null;
      entryForm.reset();
      $("name").setCustomValidity("");
      $("date").value = dateKey(selected);
      $("form-title").textContent = "일정 추가";
      $("save-entry").textContent = "추가";
      $("cancel").hidden = true;
      $("form-message").textContent = "";
      setTaskRows([]);
      refreshForm();
    }

    function fillForm(record, mode) {
      resetForm();
      formMode = mode;
      editingId = mode === "edit" ? record.id : null;
      $("kind").value = record.kind;
      entryForm.elements.slot.value = mealExamples[record.slot] ? record.slot : "아침";
      $("date").value = record.date;
      $("time").value = record.time || "";
      $("name").value = record.title;

      if (record.kind === "meal") {
        $("details").value = record.details || "";
      } else {
        const tasks = workoutTasks(record);
        setTaskRows(mode === "copy" ? tasks.map(task => ({ ...task, done: false })) : tasks);
      }

      $("form-title").textContent = mode === "copy" ? "일정 복사" : "오늘의 계획";
      $("save-entry").textContent = mode === "copy" ? "복사본 추가" : "변경 저장";
      $("cancel").hidden = false;
      refreshForm();
      (mode === "copy" ? $("date") : $("name")).focus();
    }

    $("week").addEventListener("click", () => {
      view = "week";
      renderCalendar();
    });
    $("month").addEventListener("click", () => {
      view = "month";
      chooseDate(new Date());
    });
    $("previous").addEventListener("click", () => navigate(-1));
    $("next").addEventListener("click", () => navigate(1));
    $("kind").addEventListener("change", refreshForm);
    $("name").addEventListener("input", () => $("name").setCustomValidity(""));
    $("add-task").addEventListener("click", () => addTaskRow(undefined, true));

    $("new-entry").addEventListener("click", () => {
      if (formMode === "add") $("date").value = dateKey(selected);
      $("kind").focus();
    });
    $("cancel").addEventListener("click", () => {
      resetForm();
      $("new-entry").focus();
    });

    $("example").addEventListener("click", () => {
      if ($("kind").value === "meal") {
        const [title, notes] = mealExamples[entryForm.elements.slot.value];
        if (!$("name").value.trim()) $("name").value = title;
        if (!$("details").value.trim()) $("details").value = notes;
      } else {
        if (!$("name").value.trim()) $("name").value = "전신 루틴";
        if (!readTasks().length) setTaskRows(exerciseExample.map(text => ({ text, done: false })));
      }
      $("name").setCustomValidity("");
      $("form-message").textContent = "";
    });

    entryForm.addEventListener("submit", event => {
      event.preventDefault();
      const title = $("name").value.trim();

      if (!title) {
        $("name").setCustomValidity("이름을 입력해 주세요.");
        $("name").reportValidity();
        return;
      }

      const existing = entries.find(record => record.id === editingId);
      const meal = $("kind").value === "meal";
      const tasks = meal ? [] : readTasks();
      const record = {
        id: existing?.id ?? newId(),
        kind: meal ? "meal" : "workout",
        slot: meal ? entryForm.elements.slot.value : "",
        date: $("date").value,
        time: $("time").value,
        title,
        details: meal ? $("details").value.trim() : tasks.map(task => task.text).join("\n"),
        tasks,
        done: existing?.done ?? false
      };

      const updated = existing
        ? entries.map(entry => entry.id === existing.id ? record : entry)
        : [...entries, record];

      if (!saveList(ENTRY_KEY, updated, "form-message")) return;
      entries = updated;
      const [year, month, day] = record.date.split("-").map(Number);
      selected = localDate(year, month - 1, day);
      resetForm();
      renderSchedule();
      $("form-message").textContent = existing ? "변경 내용을 저장했어요." : "일정을 추가했어요.";
    });

    function setPhotoFormOpen(open) {
      photoForm.hidden = !open;
      $("add-photo").setAttribute("aria-expanded", String(open));
      $("photo-message").textContent = "";
      if (!open) $("add-photo").focus({ preventScroll: true });
    }

    $("add-photo").addEventListener("click", () => setPhotoFormOpen(photoForm.hidden));

    function loadFileImage(src) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = () => reject(new Error("사진을 열 수 없어요. 다른 이미지 파일을 선택해 주세요."));
        image.src = src;
      });
    }

    async function prepareFile(file) {
      const supported = /\.(jpe?g|png|webp|gif|avif)$/i;
      const types = ["image/jpeg", "image/png", "image/webp", "image/gif", "image/avif"];
      if (!types.includes(file.type) && !supported.test(file.name)) {
        throw new Error("JPG, PNG, WebP, GIF, AVIF 파일을 선택해 주세요.");
      }
      if (file.size > 20 * 1024 * 1024) {
        throw new Error("20MB 이하의 이미지 파일을 선택해 주세요.");
      }

      const url = URL.createObjectURL(file);
      try {
        const image = await loadFileImage(url);
        const scale = Math.min(1, 1400 / Math.max(image.naturalWidth, image.naturalHeight));
        const canvas = document.createElement("canvas");
        canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
        canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));
        const context = canvas.getContext("2d");
        if (!context) throw new Error("이 브라우저에서 사진을 처리할 수 없어요.");
        context.fillStyle = "#fffafd";
        context.fillRect(0, 0, canvas.width, canvas.height);
        context.drawImage(image, 0, 0, canvas.width, canvas.height);
        return canvas.toDataURL("image/jpeg", .86);
      } finally {
        URL.revokeObjectURL(url);
      }
    }

    function renderBoard() {
      const board = $("board");
      const scrollPosition = board.scrollLeft;
      board.replaceChildren();
      board.classList.toggle("empty", photos.length === 0);

      if (!photos.length) {
        const empty = document.createElement("p");
        empty.className = "placeholder muted";
        empty.textContent = "＋를 눌러 사진을 담아 보세요.";
        board.append(empty);
      }

      for (const photo of photos) {
        const card = $("photo-template").content.firstElementChild.cloneNode(true);
        const image = card.querySelector("img");
        const open = card.querySelector(".photo-view");
        image.alt = photo.description || "자극 사진";
        image.referrerPolicy = "no-referrer";
        image.addEventListener("error", () => {
          open.hidden = true;
          card.querySelector(".photo-error").hidden = false;
        });
        image.src = photo.src;

        open.addEventListener("click", () => {
          const large = $("preview-image");
          large.alt = image.alt;
          large.referrerPolicy = "no-referrer";
          large.src = photo.src;
          $("preview").showModal();
        });

        const caption = card.querySelector(".photo-caption");
        caption.textContent = photo.description || "";
        caption.hidden = !photo.description;

        card.querySelector(".trash").addEventListener("click", () => {
          if (!confirm("이 사진을 보드에서 삭제할까요?")) return;
          const updated = photos.filter(item => item.id !== photo.id);
          if (!saveList(PHOTO_KEY, updated, "photo-message")) return;
          photos = updated;
          $("photo-message").textContent = "";
          renderBoard();
          $("add-photo").focus({ preventScroll: true });
        });

        board.append(card);
      }
      board.scrollLeft = scrollPosition;
    }

    $("preview").addEventListener("close", () => $("preview-image").removeAttribute("src"));

    photoForm.addEventListener("submit", async event => {
      event.preventDefault();
      const file = $("photo-file").files[0];
      const description = $("photo-description").value.trim();
      const button = $("save-photo");
      const message = $("photo-message");
      if (!file || button.disabled) return;

      button.disabled = true;
      message.textContent = "사진을 불러오는 중이에요.";

      try {
        const src = await prepareFile(file);
        const updated = [{ id: newId(), src, description }, ...photos];
        if (!saveList(PHOTO_KEY, updated, "photo-message")) return;
        photos = updated;
        renderBoard();
        $("board").scrollLeft = 0;
        photoForm.reset();
        setPhotoFormOpen(false);
      } catch (error) {
        message.textContent = error.message;
      } finally {
        button.disabled = false;
      }
    });

    resetForm();
    renderSchedule();
    renderBoard();
  </script>
</body>
</html>
